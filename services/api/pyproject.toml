[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "youtube2knowledge-api"
version = "0.1.0"
description = "YouTube transcription and configurable Wh-question generation API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.35,<1",
  "yt-dlp>=2025.1.1",
]

[project.optional-dependencies]
local-whisper = ["faster-whisper>=1.2,<2"]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
